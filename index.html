<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #6c2cff55, transparent 35%),
        radial-gradient(circle at 80% 80%, #00d9ff44, transparent 35%),
        #080812;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:white;
}

/* Floating background particles */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:.35;
    animation:float 6s infinite ease-in-out;
}

.p1{left:10%;top:20%;animation-delay:0s}
.p2{left:80%;top:15%;animation-delay:1s}
.p3{left:20%;top:80%;animation-delay:2s}
.p4{left:90%;top:65%;animation-delay:3s}
.p5{left:50%;top:10%;animation-delay:4s}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-35px) scale(1.5)}
}

/* Main container */
.container{
    width:min(92%,420px);
    position:relative;
    z-index:5;
    animation:pageIn 1s ease forwards;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(50px) scale(.92);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Animated logo */
.logo{
    width:95px;
    height:95px;
    margin:0 auto 25px;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    background:linear-gradient(135deg,#7c3cff,#00c8ff);
    box-shadow:
        0 0 25px #713cff88,
        0 0 60px #00c8ff44;
    animation:
        logoFloat 3s ease-in-out infinite,
        logoRotate 1s ease forwards;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

@keyframes logoRotate{
    from{
        opacity:0;
        transform:scale(0) rotate(-180deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

/* Card */
.card{
    position:relative;
    padding:32px 25px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(15,15,30,.78);
    backdrop-filter:blur(20px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
}

.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:30px;
    padding:2px;
    background:linear-gradient(
        120deg,
        transparent,
        #8b5cff,
        transparent,
        #00d9ff,
        transparent
    );
    background-size:300% 300%;
    animation:borderMove 5s linear infinite;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

@keyframes borderMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

h1{
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaaac0;
    margin-bottom:28px;
    font-size:14px;
}

/* Inputs */
.input-box{
    position:relative;
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    height:58px;
    padding:0 18px;
    border:none;
    outline:none;
    border-radius:15px;
    color:white;
    background:#ffffff0c;
    border:1px solid #ffffff18;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    border-color:#7c5cff;
    background:#ffffff12;
    box-shadow:0 0 20px #7c5cff25;
    transform:translateY(-2px);
}

.input-box label{
    position:absolute;
    left:18px;
    top:19px;
    color:#88889d;
    pointer-events:none;
    transition:.25s;
    font-size:14px;
}

.input-box input:focus + label,
.input-box input:not(:placeholder-shown) + label{
    top:-8px;
    left:14px;
    padding:0 6px;
    background:#10101f;
    color:#9b82ff;
    font-size:11px;
}

/* Button */
.login-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(135deg,#7c3cff,#00bfff);
    box-shadow:0 10px 30px #663cff44;
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px #663cff66;
}

.login-btn:active{
    transform:scale(.97);
}

.login-btn::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    background:#ffffff44;
    border-radius:50%;
    left:-120px;
    top:-20px;
    transition:.6s;
}

.login-btn:hover::after{
    left:110%;
}

/* Bottom text */
.bottom{
    text-align:center;
    margin-top:22px;
    color:#858599;
    font-size:13px;
}

.bottom span{
    color:#9b7cff;
    cursor:pointer;
}

/* Success animation */
.success{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#080812ee;
    z-index:20;
}

.success.show{
    display:flex;
    animation:fadeIn .4s ease;
}

.success-box{
    text-align:center;
    animation:successPop .6s cubic-bezier(.2,1.5,.5,1);
}

.check{
    width:90px;
    height:90px;
    margin:auto auto 20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    background:linear-gradient(135deg,#7c3cff,#00c8ff);
    box-shadow:0 0 50px #7c3cff77;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes successPop{
    from{
        transform:scale(.4);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* Mobile */
@media(max-width:480px){
    .card{
        padding:28px 20px;
    }

    h1{
        font-size:27px;
    }

    .logo{
        width:82px;
        height:82px;
        font-size:38px;
    }
}
</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>

<div class="container">

    <div class="logo">⚡</div>

    <div class="card">

        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue</p>

        <form id="loginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder=" "
                    required
                >
                <label>Email Address</label>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    placeholder=" "
                    required
                >
                <label>Password</label>
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div class="bottom">
            Don't have an account?
            <span>Create Account</span>
        </div>

    </div>
</div>

<!-- Success screen -->
<div class="success" id="success">

    <div class="success-box">

        <div class="check">✓</div>

        <h2>Login Successful</h2>

        <p style="color:#999;margin-top:8px">
            Welcome back!
        </p>

    </div>

</div>

<script>

const form = document.getElementById("loginForm");
const success = document.getElementById("success");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const button = form.querySelector(".login-btn");

    button.innerHTML = "Loading...";
    button.style.pointerEvents = "none";

    setTimeout(() => {

        success.classList.add("show");

    }, 1000);

});

</script>

</body>
</html>
